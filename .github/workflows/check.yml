name: Check

# Checks every pull request before it can be merged — and every merge to main
# is a release (build.yml), so this is what keeps a broken change from
# reaching the team:
#
#   • rust (Linux and Windows): the Rust tests.
#   • rust (macOS): the AI bridge's tests only (#32): the local channel and
#     `submarine --mcp`, which work differently on each system.
#   • rust (Windows) also runs `submarine --mcp`'s test as a release build:
#     there Submarine is a windowed program, and the helper's stdin and stdout
#     have to work all the same.
#   • rust (Linux) also runs clippy: an error fails the check, and so does a
#     rise in the number of warnings over .github/clippy-warnings. Most of
#     today's warnings are in the original project's code, and fixing them
#     there would make every sync conflict, so the count only has to not
#     grow. Lower the number in that file when warnings are fixed. Clippy
#     runs on a fixed Rust version (CLIPPY_RUST), since each Rust release
#     adds lints that would raise the count on every pull request at once;
#     move the version and the count together.
#   • frontend: the TypeScript check and a build of the page.
#
# Not `cargo fmt --check`, for the same reason: the original project's code
# isn't rustfmt-formatted, and formatting it would rewrite its files.
#
# No path filters: a required check that doesn't run leaves the pull request
# waiting for it forever.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces a check still running.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLIPPY_RUST: "1.97.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: rust (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_name: linux
          - platform: windows-latest
            os_name: windows
          - platform: macos-latest
            os_name: macos
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      # Nothing here pushes — keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, as of 2026-10-20
        with:
          # Named here: the action takes it from its ref otherwise ("stable"
          # was the ref), and a commit SHA says nothing.
          toolchain: stable

      - name: Install Rust for clippy
        if: matrix.os_name == 'linux'
        run: rustup toolchain install "$CLIPPY_RUST" --profile minimal --component clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # What Tauri links on Linux (the same as build.yml, without the
      # packaging tools).
      - name: Install Linux deps
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # The Rust code bundles the built page from ../dist; the tests don't use
      # it, so a stand-in is enough here (the frontend job builds the real one).
      - name: Stand-in for the built page
        shell: bash
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><title>Submarine</title>' > dist/index.html

      - name: Tests
        if: matrix.os_name != 'macos'
        working-directory: src-tauri
        run: cargo test --locked

      - name: AI bridge tests
        if: matrix.os_name == 'macos'
        working-directory: src-tauri
        run: |
          cargo test --locked --lib ai::
          cargo test --locked --test mcp_helper

      - name: The MCP helper as a windowed program
        if: matrix.os_name == 'windows'
        working-directory: src-tauri
        run: cargo test --locked --release --test mcp_helper

      - name: Clippy, and no new warnings
        if: matrix.os_name == 'linux'
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$CLIPPY_RUST" clippy --locked --lib 2>&1 | tee clippy.log
          COUNT="$(grep -oE 'generated [0-9]+ warnings?' clippy.log | grep -oE '[0-9]+' | head -1 || true)"
          COUNT="${COUNT:-0}"
          ALLOWED="$(tr -dc '0-9' < ../.github/clippy-warnings)"
          echo "Clippy warnings: $COUNT (allowed: $ALLOWED)"
          if [ "$COUNT" -gt "$ALLOWED" ]; then
            echo "::error::Clippy has $COUNT warnings, more than the $ALLOWED allowed in .github/clippy-warnings. Fix the new ones."
            exit 1
          fi
          if [ "$COUNT" -lt "$ALLOWED" ]; then
            echo "::notice::Clippy has $COUNT warnings, fewer than $ALLOWED: lower the number in .github/clippy-warnings to $COUNT."
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install npm deps
        run: npm ci

      # The licence notices, the TypeScript check and the page, as a release
      # builds them.
      - name: TypeScript check and build
        run: npm run build
