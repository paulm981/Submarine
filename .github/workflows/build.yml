name: Build

# Builds Submarine's installers on GitHub's runners (Windows, macOS, Linux):
#
#   • Every push to main (a merged pull request) → a release of the fork,
#     tagged with the original project's version and the fork's count:
#     v0.4.0-fork.1, v0.4.0-fork.2, …, then v0.4.1-fork.1 once 0.4.1 is in
#     (the version job). Its installers have the same names in every
#     release, so a link to releases/latest/download/<name> always gets the
#     newest. The app shows its version and says when there's a newer one.
#   • Run workflow (Actions tab) → builds the version typed in, as a test;
#     nothing is published.
#
# Android is built only when the repository variable BUILD_ANDROID is
# "true" and the signing secrets are set (see the android job).
on:
  push:
    branches: [main]
    # A change to the docs alone isn't a new release.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as a test (e.g. v0.0.0-test); nothing is published"
        required: true
        default: "v0.0.0-test"

# Least privilege by default: the version, build and android jobs only read
# the repo. Only the release job, which publishes the release, is given
# `contents: write` (on the job itself, below).
permissions:
  contents: read

# One run of main at a time, never cancelled: every run of main is a release,
# and the next one's number comes from the tags the one before made. A push
# that comes while one runs waits; when several do, GitHub keeps only the
# newest waiting, which has the others' changes too.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Faster, cheaper CI builds. Incremental compilation costs time + disk in
# clean-checkout environments where there's nothing to be incremental
# against; -D warnings would be great here but breaks too many crates,
# so leave at default.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  # A release build (src-tauri/build.rs): its users update by release, so it
  # doesn't carry its commit. A manual test build is built the same way.
  SUBMARINE_RELEASE: "1"

jobs:
  # The release this run makes: the original project's version (from
  # tauri.conf.json) and the fork's count, one more than its newest release
  # of that version. A manual run takes the version typed in.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      # All of history, for the tags. Nothing here pushes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the version
        id: pick
        shell: bash
        # The typed-in version comes in through the environment, not spliced
        # into the script with ${{ }} — a value like `; rm -rf …` would
        # otherwise run as part of this step. Either way the result is checked
        # against a version shape before it's used.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            BASE="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            if ! printf '%s' "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Unexpected version in tauri.conf.json: $BASE"
              exit 1
            fi
            LAST="$(git tag -l "v$BASE-fork.*" | sed "s/^v$BASE-fork\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
            RAW="v$BASE-fork.$(( ${LAST:-0} + 1 ))"
          fi
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "Refusing an unexpected version string: $RAW" >&2
            exit 1
          fi
          VERSION="${RAW#v}"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "This run's version: $VERSION"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: the setup .exe (NSIS), which installs over any earlier
          # one. No .msi: every release of a version has the same installer
          # version (see "Stamp version"), and Windows won't install an MSI
          # over one of the same version.
          - platform: windows-latest
            os_name: windows
            bundles: "nsis"
            rust_target: x86_64-pc-windows-msvc

          # macOS Apple Silicon. We produce both:
          #   - Submarine.app (zipped → unzip + double-click, no DMG drag)
          #   - Submarine_x.y.z_aarch64.dmg (classic DMG installer)
          # Intel macOS users can run this same arm64 build under Rosetta 2 —
          # we dropped the dedicated macos-13 (Intel) matrix entry because
          # GitHub's Intel macOS runner pool is so scarce that jobs would
          # routinely hit the 45-minute queue timeout and fail the release.
          - platform: macos-latest
            os_name: macos-arm64
            bundles: "app,dmg"
            rust_target: aarch64-apple-darwin

          # Linux: ship four flavours so users on any major distro can
          # double-click an installer that matches their package manager:
          #   - .deb   → Debian / Ubuntu / Mint
          #   - .rpm   → Fedora / RHEL / openSUSE
          #   - .AppImage → distro-agnostic, no install required
          # And a separate Arch step further down produces .pkg.tar.zst
          # via makepkg inside an Arch Docker container (Tauri's bundler
          # has no native Arch backend).
          - platform: ubuntu-22.04
            os_name: linux-x64
            bundles: "deb,rpm,appimage"
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      # Don't leave the checkout token in .git/config where a later build
      # step (or a compromised dependency) could use it — nothing here pushes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The version job's pick, exposed to later steps via $GITHUB_ENV.
      - name: Resolve version
        shell: bash
        # Through the environment and checked for shape — see the version job.
        env:
          RAW: ${{ needs.version.outputs.version }}
        run: |
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "Refusing an unexpected version string: $RAW" >&2
            exit 1
          fi
          VERSION="${RAW#v}"
          # Strict-semver form: everything from the first '-' stripped.
          # Windows installers want a numeric version, and Arch's makepkg
          # rejects hyphens in pkgver outright. Both fall back to this
          # shortened string for stamping / pkgver; the other targets
          # (Android, macOS, .deb, .rpm, AppImage) see the full string.
          VERSION_STRICT="${VERSION%%-*}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_STRICT=$VERSION_STRICT" >> "$GITHUB_ENV"
          # The whole version for the app to show and compare (build.rs),
          # on Windows too, where the manifests get the strict form.
          echo "SUBMARINE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION (strict: $VERSION_STRICT)"

      - name: Stamp version into manifests
        shell: bash
        run: |
          # Windows gets the strict form (see "Resolve version"); the app
          # still knows its whole version from SUBMARINE_VERSION. Other
          # platforms keep the full string.
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            STAMP="$VERSION_STRICT"
          else
            STAMP="$VERSION"
          fi
          echo "Stamping manifests with $STAMP"
          STAMP_VERSION="$STAMP" node -e "
            const fs=require('fs');
            const v=process.env.STAMP_VERSION;
            // Cargo.toml: only the package.version line — leave dep versions alone.
            const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8');
            const next=cargo.replace(/^version *= *\".*\"/m, 'version = \"'+v+'\"');
            fs.writeFileSync('src-tauri/Cargo.toml', next);
            // tauri.conf.json: top-level version key.
            const conf=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            conf.version=v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2)+'\n');
            console.log('Stamped version', v);
          "

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux-only: WebKit + AppImage tooling + rpmbuild. The Tauri Linux
      # build links webkit2gtk-4.1, ships an AppImage built via
      # `linuxdeploy` (needs librsvg + libsoup3), and now also produces an
      # .rpm which requires the `rpm` package's `rpmbuild` binary.
      - name: Install Linux deps
        if: matrix.os_name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            file \
            rpm

      - name: Install npm deps
        run: npm ci

      # We deliberately do NOT run `npm run build` here — tauri-action
      # invokes the `beforeBuildCommand` defined in tauri.conf.json
      # (which is `npm run build`) before the Rust build, so a manual
      # invocation would just duplicate work and risk version drift
      # between the two passes.
      - name: Build Tauri bundles
        # Pinned to v0 (major) — Tauri maintainers move that tag in lockstep
        # with stable releases. For tighter reproducibility pin to a SHA.
        # russh >= 0.63 implements RSA / legacy DH / SHA-1 MACs in pure
        # Rust, so release and local builds share one algorithm set and no
        # OpenSSL (or Perl) is needed anymore.
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      # Arch: Tauri's bundler has no native pacman backend, so we run
      # makepkg ourselves inside an `archlinux:latest` container. The
      # PKGBUILD in packaging/arch/ installs the already-built Tauri
      # release binary plus a .desktop and icon from $startdir — no
      # source download / no rebuild — so the result is the same binary
      # users get from the .deb, just packaged for pacman. Compression
      # stays at pacman's default (zstd at level 19, what every Arch
      # mirror uses) — no custom XZ / no MAKEPKG_CONF tweaks.
      - name: Build Arch package
        if: matrix.os_name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arch-build
          cp packaging/arch/PKGBUILD             arch-build/
          cp packaging/arch/submarine.desktop    arch-build/
          cp src-tauri/target/${{ matrix.rust_target }}/release/submarine arch-build/
          cp src-tauri/icons/icon.png            arch-build/

          # Run makepkg in a throwaway Arch container. base-devel pulls in
          # fakeroot/binutils/etc; we create an unprivileged build user
          # because makepkg refuses to run as root. --skipinteg because
          # the PKGBUILD has no source= entries (everything is local).
          # --nodeps because the depends=() are RUNTIME-only (webkit2gtk-
          # 4.1 / gtk3 / libsoup3 — what the user's machine needs to
          # actually launch the app). package() doesn't compile or link
          # anything; it just installs the already-built Tauri binary +
          # .desktop + icon, so the dep check in the build container
          # would only force us to download those packages for nothing.
          # Arch's pkgver forbids hyphens (and colons, slashes, spaces).
          # For a dev / rc / beta release the version we WANT to stamp
          # is "0.2.37-dev" but pkgver has to be "0.2.37" or makepkg
          # rejects the PKGBUILD with `pkgver is not allowed to contain
          # colons, forward slashes, hyphens or whitespace`. Passing
          # VERSION_STRICT keeps the pkg name usable; the file name
          # inside the artefact bundle still says v${VERSION} because
          # we compose that from $VERSION (with the pre-release intact)
          # elsewhere in the workflow.
          docker run --rm \
            -v "$PWD/arch-build:/build" \
            -w /build \
            -e VERSION="$VERSION_STRICT" \
            archlinux:latest \
            bash -c '
              set -e
              pacman -Syu --noconfirm --needed base-devel sudo
              useradd -m b
              echo "b ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R b:b /build
              sudo -u b sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
              sudo -u b makepkg -f --noconfirm --skipinteg --nodeps
            '

      # macOS: zip the .app bundle so a user can download a single file
      # and just double-click. No DMG drag-to-Applications dance.
      - name: Zip macOS .app
        if: startsWith(matrix.os_name, 'macos')
        run: |
          APP_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos"
          cd "$APP_DIR"
          # The .app folder is named after productName ("Submarine").
          # Wrap it in a versioned zip for the release asset name.
          ARCH="${{ matrix.os_name }}"
          ZIP_NAME="Submarine-v${{ env.VERSION }}-${ARCH}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "Submarine.app" "$ZIP_NAME"
          echo "MAC_ZIP=$APP_DIR/$ZIP_NAME" >> $GITHUB_ENV

      # Collect every artifact this job produced into one folder for upload.
      - name: Stage artifacts (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path "src-tauri/target/${{ matrix.rust_target }}/release/bundle" -Recurse -Include *.msi,*.exe |
            Copy-Item -Destination artifacts/

      # Portable build (#35): the bare exe alongside an empty submarine-data
      # folder — that folder is the switch that makes Submarine keep all of its
      # data there instead of %APPDATA% (see src-tauri/src/portable.rs). .NET's
      # ZipFile records the empty folder as an entry, so it survives the round
      # trip and the extracted copy is portable out of the box.
      - name: Zip Windows portable build
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force -Path portable-build
          New-Item -ItemType Directory -Force -Path (Join-Path $stage.FullName submarine-data) | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.rust_target }}/release/submarine.exe" $stage.FullName
          Copy-Item packaging/windows/README-portable.txt (Join-Path $stage.FullName README.txt)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path (Resolve-Path artifacts).Path "Submarine-v${{ env.VERSION }}-windows-x64-portable.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage.FullName, $zip)

      - name: Stage artifacts (macOS)
        if: startsWith(matrix.os_name, 'macos')
        run: |
          mkdir -p artifacts
          cp "$MAC_ZIP" artifacts/
          find "src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg" -name "*.dmg" -exec cp {} artifacts/ \; || true

      - name: Stage artifacts (Linux)
        if: matrix.os_name == 'linux-x64'
        run: |
          mkdir -p artifacts
          # Tauri bundles land in target/.../release/bundle/{deb,rpm,appimage}/.
          # Arch .pkg.tar.zst is in arch-build/ from the previous step.
          find "src-tauri/target/${{ matrix.rust_target }}/release/bundle" \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} artifacts/ \;
          find arch-build -maxdepth 1 -name "*.pkg.tar.zst" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: submarine-${{ matrix.os_name }}
          path: artifacts/*
          if-no-files-found: error

  # Android: separate job because the setup (JDK 17 + Android SDK/NDK +
  # cargo-ndk + Android Rust targets) is wholly different from the
  # desktop matrix. Produces a signed universal release APK plus per-ABI
  # APKs when Tauri splits them.
  #
  # Signing: the release keystore is base64-encoded in the
  # SUBMARINE_KEYSTORE_B64 secret. We decode it into a workspace-local
  # file and pass its path + passwords to Gradle via the
  # SUBMARINE_KEYSTORE_* env vars that build.gradle.kts reads. If any
  # secret is missing, the build still runs but Gradle will produce an
  # unsigned release APK — the keystore secrets are gating, not blocking.
  #
  # Optional in this fork: only when the repository variable BUILD_ANDROID
  # is "true" (Settings › Secrets and variables › Actions › Variables) — so
  # a release never waits on secrets that aren't there.
  android:
    needs: version
    if: vars.BUILD_ANDROID == 'true'
    runs-on: ubuntu-22.04
    env:
      # The NDK this job installs and builds with (the runner image has its
      # own, newer one as ANDROID_NDK_ROOT).
      NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@v4
        # Nothing here pushes — see the build job.
        with:
          persist-credentials: false

      - name: Resolve version
        shell: bash
        # Through the environment and checked for shape — see the version job.
        env:
          RAW: ${{ needs.version.outputs.version }}
        run: |
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "Refusing an unexpected version string: $RAW" >&2
            exit 1
          fi
          VERSION="${RAW#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stamp version into manifests
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const v=process.env.VERSION;
            const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8');
            const next=cargo.replace(/^version *= *\".*\"/m, 'version = \"'+v+'\"');
            fs.writeFileSync('src-tauri/Cargo.toml', next);
            const conf=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            conf.version=v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2)+'\n');
          "

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      # Every later step uses that NDK. The runner's ANDROID_NDK_ROOT is a
      # machine variable, which `${{ env.ANDROID_NDK_ROOT }}` doesn't see:
      # the APK step got an empty NDK_HOME ("Android NDK invalid"), and the
      # symlinks below went into the runner's own NDK. Written to
      # GITHUB_ENV, it is the job's for both.
      - name: Use the installed NDK
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -f "$NDK/source.properties" ]; then
            echo "::error::NDK $NDK_VERSION not found at $NDK"
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "Using the NDK at $NDK"

      - name: Install Rust with Android targets
        # Only the two ABIs that ship in real Android phones — aarch64
        # (modern arm64) and armv7 (older 32-bit arm). x86 / x86_64 are
        # emulator-only and we explicitly drop them to keep APKs lean.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Some C build scripts in the tree (cc-rs driven, e.g. ring / zstd /
      # sqlite) may spawn binutils via the legacy `<target>-ranlib` /
      # `<target>-ar` / `<target>-strip` names. NDK 27 ships only the
      # unprefixed `llvm-ranlib` / `llvm-ar` (the prefixed symlinks were
      # dropped around NDK 23), which surfaces as "<target>-ranlib: not
      # found" and make exiting 127.
      #
      # Create the missing prefixed symlinks inside the NDK's bin dir, then
      # add that dir to $GITHUB_PATH so any cc-rs-driven build can spawn
      # them by name. Both Rust targets (aarch64-linux-android,
      # armv7-linux-androideabi) get their full set.
      - name: Symlink legacy binutils names for NDK cross-compile
        run: |
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_BIN" ]; then
            echo "::error::NDK bin dir not found at $NDK_BIN"
            exit 1
          fi
          for target in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi; do
            for tool in ranlib ar strip nm objcopy objdump readelf; do
              link="$NDK_BIN/${target}-${tool}"
              if [ ! -e "$link" ]; then
                ln -sf "$NDK_BIN/llvm-${tool}" "$link"
              fi
            done
          done
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          ls -la "$NDK_BIN" | grep -E '(ranlib|ar|strip)$' | head -20

      - name: Install npm deps
        run: npm ci

      # Decode the base64-encoded keystore secret into a real .jks on disk
      # and write the matching SUBMARINE_KEYSTORE_PATH env var so Gradle's
      # signingConfig picks it up. Fail the build loudly if any of the four
      # signing secrets are missing — silent fallback to an unsigned APK
      # ("Submarine-vX.Y.Z-app-universal-release-unsigned.apk") produces a
      # file Android rejects at install with "package appears to be invalid".
      # The four required secrets:
      #   SUBMARINE_KEYSTORE_B64        — base64 of the .jks
      #   SUBMARINE_KEYSTORE_PASSWORD   — keystore password
      #   SUBMARINE_KEY_ALIAS           — alias inside the keystore
      #   SUBMARINE_KEY_PASSWORD        — key password
      - name: Materialize release keystore
        shell: bash
        env:
          SUBMARINE_KEYSTORE_B64: ${{ secrets.SUBMARINE_KEYSTORE_B64 }}
          SUBMARINE_KEYSTORE_PASSWORD: ${{ secrets.SUBMARINE_KEYSTORE_PASSWORD }}
          SUBMARINE_KEY_ALIAS: ${{ secrets.SUBMARINE_KEY_ALIAS }}
          SUBMARINE_KEY_PASSWORD: ${{ secrets.SUBMARINE_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$SUBMARINE_KEYSTORE_B64" ]      && missing+=("SUBMARINE_KEYSTORE_B64")
          [ -z "$SUBMARINE_KEYSTORE_PASSWORD" ] && missing+=("SUBMARINE_KEYSTORE_PASSWORD")
          [ -z "$SUBMARINE_KEY_ALIAS" ]         && missing+=("SUBMARINE_KEY_ALIAS")
          [ -z "$SUBMARINE_KEY_PASSWORD" ]      && missing+=("SUBMARINE_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Secrets required for signing: ${missing[*]}"
            echo "::error::Add them at https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$SUBMARINE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          if [ ! -s "$RUNNER_TEMP/signing/release.jks" ]; then
            echo "::error::SUBMARINE_KEYSTORE_B64 decoded to an empty file — verify the secret is valid base64."
            exit 1
          fi
          echo "SUBMARINE_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
          echo "Release keystore materialized ($(wc -c < "$RUNNER_TEMP/signing/release.jks") bytes)."

      # Universal APK — single .apk users sideload from GitHub. Split APKs
      # were tried in v0.2.18/v0.2.19 but Android rejects them as "invalid
      # package" when installed standalone because split APKs need their
      # matching base.apk installed at the same time (the Play Store
      # mechanism). For direct sideload only a universal APK works.
      #
      # AAB was dropped in v0.2.30 — we don't ship through Google Play, so
      # the .aab artifact was dead weight (users can't sideload it) and
      # doubled the Android build time on CI. If Play Store distribution
      # becomes a goal later, re-add `android:build:aab` to package.json
      # and the matching find/copy loop here.
      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          SUBMARINE_KEYSTORE_PASSWORD: ${{ secrets.SUBMARINE_KEYSTORE_PASSWORD }}
          SUBMARINE_KEY_ALIAS: ${{ secrets.SUBMARINE_KEY_ALIAS }}
          SUBMARINE_KEY_PASSWORD: ${{ secrets.SUBMARINE_KEY_PASSWORD }}
        run: npm run android:build

      - name: Stage Android artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # APKs land under app/build/outputs/apk/<abi>/release/*.apk
          # Rename to include the version so release asset names are readable.
          # `-name "*-unsigned.apk"` is the unsigned variant Gradle produces
          # when signingConfig is absent — explicitly excluded so a
          # mis-wired keystore cannot leak an uninstallable APK to a release.
          shopt -s nullglob
          found=0
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*-release*.apk" ! -name "*-unsigned.apk"); do
            base="$(basename "$apk" .apk)"
            cp "$apk" "artifacts/Submarine-v${{ env.VERSION }}-${base}.apk"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No signed APK produced — Gradle likely ran without signingConfig."
            exit 1
          fi
          # Verify each APK is actually signed before we ship it.
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          for apk in artifacts/*.apk; do
            echo "--- apksigner verify $apk ---"
            "$apksigner" verify --verbose "$apk"
          done
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: submarine-android
          path: artifacts/*
          if-no-files-found: error

  # Publishes this run's release: the installers under names that are the
  # same in every release (so releases/latest/download/<name> always gets
  # the newest), with notes on installing them. Only for a push to main; a
  # manual run publishes nothing. Also when another platform's build failed:
  # the Windows build still goes out. Never without it (see "Name the files").
  release:
    needs: [version, build, android]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.version.result == 'success'
    # Only this job writes: it publishes the release.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Name the files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          pick() { # pick <pattern> <name>
            local f
            f="$(find dist -type f -name "$1" | head -1)"
            if [ -n "$f" ]; then cp "$f" "release-files/$2"; else echo "::warning::no $1 in this build"; fi
          }
          pick "*-setup.exe"       "Submarine-windows-x64-setup.exe"
          pick "*-portable.zip"    "Submarine-windows-x64-portable.zip"
          pick "*.dmg"             "Submarine-macos-arm64.dmg"
          pick "*.app.zip"         "Submarine-macos-arm64.app.zip"
          pick "*.AppImage"        "Submarine-linux-x86_64.AppImage"
          pick "*.deb"             "Submarine-linux-amd64.deb"
          pick "*.rpm"             "Submarine-linux-x86_64.rpm"
          pick "*.pkg.tar.zst"     "Submarine-linux-x86_64.pkg.tar.zst"
          # Android, when it's built, keeps its per-ABI names.
          find dist -type f -name "*.apk" -exec cp {} release-files/ \;
          ls -la release-files/
          if [ ! -f release-files/Submarine-windows-x64-setup.exe ]; then
            echo "::error::The Windows build didn't finish, so no release is made; the next merge makes one."
            exit 1
          fi

      - name: Write the notes
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DL="https://github.com/$REPO/releases/download/$TAG"
          has() { [ -f "release-files/$1" ]; }
          link() { echo "[$2]($DL/$1)"; }
          {
            echo "Built from commit [\`${SHA:0:7}\`](https://github.com/$REPO/commit/$SHA). What changed is in [CHANGELOG.md](https://github.com/$REPO/blob/main/CHANGELOG.md). Submarine shows its version in the title bar, and the profile screen says when there's a newer release."
            echo
            echo "### Windows"
            echo "- **$(link Submarine-windows-x64-setup.exe Submarine-windows-x64-setup.exe)**: installs Submarine, or updates it — run a newer one over it. Your profiles and settings are kept."
            if has Submarine-windows-x64-portable.zip; then
              echo "- **$(link Submarine-windows-x64-portable.zip Submarine-windows-x64-portable.zip)**: no install. Unzip anywhere (a USB stick works) and run \`submarine.exe\`; everything it keeps stays in the \`submarine-data\` folder beside it."
            fi
            echo
            echo "These builds aren't code-signed, so the first time Windows may say *\"Windows protected your PC\"*: click **More info → Run anyway**."
            mac=()
            has Submarine-macos-arm64.dmg && mac+=("$(link Submarine-macos-arm64.dmg Submarine-macos-arm64.dmg)")
            has Submarine-macos-arm64.app.zip && mac+=("$(link Submarine-macos-arm64.app.zip Submarine-macos-arm64.app.zip) (unzip and run)")
            if [ "${#mac[@]}" -gt 0 ]; then
              echo
              echo "### macOS (Apple silicon)"
              (IFS='|'; echo "${mac[*]}" | sed 's/|/ · /g')
              echo
              echo "Not notarized by Apple, so the first time macOS says *\"Apple could not verify…\"*: move the app into **Applications**, open it once, then open **System Settings → Privacy & Security** and click **Open Anyway** (on macOS 14 and older, right-click the app → **Open** works too). Or in Terminal: \`xattr -dr com.apple.quarantine /Applications/Submarine.app\`. [Step by step](https://github.com/$REPO#first-open-on-macos)."
            fi
            linux=()
            has Submarine-linux-x86_64.AppImage && linux+=("$(link Submarine-linux-x86_64.AppImage AppImage)")
            has Submarine-linux-amd64.deb && linux+=("$(link Submarine-linux-amd64.deb .deb)")
            has Submarine-linux-x86_64.rpm && linux+=("$(link Submarine-linux-x86_64.rpm .rpm)")
            has Submarine-linux-x86_64.pkg.tar.zst && linux+=("$(link Submarine-linux-x86_64.pkg.tar.zst Arch)")
            if [ "${#linux[@]}" -gt 0 ]; then
              echo
              echo "### Linux"
              (IFS='|'; echo "${linux[*]}" | sed 's/|/ · /g')
            fi
            echo
          } > notes.md

      # Published straight away: the app's update check only sees published
      # releases. GitHub's list of merged pull requests goes after the notes.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Submarine ${{ needs.version.outputs.tag }}
          body_path: notes.md
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: release-files/*

      # The old "Latest build" page, which builds up to 244 still point to:
      # it now sends people to the releases. Its title is left as it was, so
      # those builds don't announce a "newer build" there; they announce the
      # release instead.
      - name: Point the old Latest build page at the releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s\n' \
            "**This page isn't updated any more.** Every change to Submarine is now a release, numbered like v0.4.0-fork.2: get the newest from **[Releases](https://github.com/$REPO/releases/latest)**." \
            "" \
            "Builds up to 244 say there's a new version and link to it." > moved.md
          gh release edit latest-main --repo "$REPO" --notes-file moved.md || echo "::notice::No Latest build page to update."
